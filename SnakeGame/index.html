<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        body {
            background: linear-gradient(45deg, black, red);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
        }

        canvas {
            background-color: green;
            display: block;
            margin: 20px auto;
            border: 2px solid yellow;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #0f0;
            border: none;
            border-radius: 4px;
        }
        button:disabled {
            padding: 10px 20px;
            font-size: 16px;
            cursor: not-allowed;
            background: #0f0;
            border: none;
            border-radius: 4px;
        }

        #score {
            margin-top: 10px;
            font-size: 18px;
        }

    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <button id="startBtn">Start Game</button>
        <canvas id="game" width="400" height="400"></canvas>
        <div id="score">Score: 0</div>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d")
        const startBtn = document.getElementById("startBtn");

        const box = 20;
        const canvasSize = 400;

        let snake, direction, score, food;
        let game = null;
        let running = false;

        document.addEventListener("keydown", changeDirection);
        startBtn.addEventListener("click", startGame);

        function startGame() {
            if(running) return;

            snake = [{x: 200, y: 200}];
            direction = "RIGHT";
            score = 0;
            food = generateFood();
            running = true;

            document.getElementById("score").innerText = "Score: 0";
            startBtn.disabled = true;

            game = setInterval(draw, 300);
        }

        function changeDirection(e) {
            if(!running) return;

            if(e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
            else if(e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
            else if(e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
            else if(e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
            
        }

        function generateFood() {
            const cols = canvasSize / box;
            return {
                x: Math.floor(Math.random() * cols) * box,
                y: Math.floor(Math.random() * cols) * box
            };
        }

        function collision(head, array) {
            return array.some(part => part.x === head.x && part.y === head.y);
        }

        function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#0f0" : "#0a0";
        ctx.fillRect(part.x, part.y, box, box);
    });

    // draw food
    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, box, box);

    let head = { ...snake[0] };

    if (direction === "UP") head.y -= box;
    else if (direction === "DOWN") head.y += box;
    else if (direction === "LEFT") head.x -= box;
    else if (direction === "RIGHT") head.x += box;

    // Wall collision
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= canvasSize ||
        head.y >= canvasSize
    ) {
        clearInterval(game);
        running = false;
        startBtn.disabled = false;
        alert("Game Over! Your Score: " + score);
        return;
    }

    // Will we eat?
    const willEat = (head.x === food.x && head.y === food.y);

    if (willEat) {
        score++;
        document.getElementById("score").innerText = "Score: " + score;
        food = generateFood();
    } else {
        // remove tail before self-collision check
        snake.pop();
    }

    // Self-collision (after tail removed if not eating)
    if (collision(head, snake)) {
        clearInterval(game);
        running = false;
        startBtn.disabled = false;
        alert("Game Over! Your Score: " + score);
        return;
    }

    snake.unshift(head);
}

    </script>
</body>
</html>
