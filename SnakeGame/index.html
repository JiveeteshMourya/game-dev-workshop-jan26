<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="icon" href="./icon.png"/>

    <style>
        body {
            background: linear-gradient(135deg, #0f2027 0%, #0b6b3a 40%, #f7fbcc 100%);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            /* height: 100vh; */
            margin: 0;
            padding-bottom: 30px;
        }

        .game-container {
            text-align: center;
        }

        canvas {
            background-color: green;
            display: block;
            margin: 10px auto;
            border: 2px solid yellow;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #0f0;
            border: none;
            border-radius: 4px;
        }
        button:disabled {
            padding: 10px 20px;
            font-size: 16px;
            cursor: not-allowed;
            background: #0f0;
            border: none;
            border-radius: 4px;
        }

        #score {
            margin-top: 10px;
            font-size: 18px;
        }

        .control-btns-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .controlBtn {
            height: 40px;
            width: 50px;
            background-color: yellow;
            color: blue;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            /* padding: 5px; */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #middleControlBtns {
            width: 80%;
            display: flex;
            justify-content: space-around;
        }

        @media (max-width: 425px) {
            canvas {
                height: 300px;
                width: 300px;
            }
        }

    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <button id="startBtn">Start Game</button>
        <canvas id="game" width="400" height="400"></canvas>
        <div id="score">Score: 0</div>
        <div class="control-btns-container">
            <div id="controlBtnUp" class="controlBtn">&#x2191;</div>
            <div id="middleControlBtns">
                <div id="controlBtnLeft" class="controlBtn">&#x2190;</div>
                <div id="controlBtnRight" class="controlBtn">&#x2192;</div>
            </div>
            <div id="controlBtnDown" class="controlBtn">&#x2193;</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d")
        const startBtn = document.getElementById("startBtn");

        const box = 20;
        const canvasSize = 400;

        let snake, direction, score, food;
        let game = null;
        let running = false;

        document.addEventListener("keydown", changeDirection);
        startBtn.addEventListener("click", startGame);

        const setDirection = (newDir, blockedDir) =>
            direction !== blockedDir && (direction = newDir);

        controlBtnUp.addEventListener("click", () => setDirection("UP", "DOWN"));
        controlBtnDown.addEventListener("click", () => setDirection("DOWN", "UP"));
        controlBtnRight.addEventListener("click", () => setDirection("RIGHT", "LEFT"));
        controlBtnLeft.addEventListener("click", () => setDirection("LEFT", "RIGHT"));

        function startGame() {
            if(running) return;

            snake = [{x: 200, y: 200}];
            direction = "RIGHT";
            score = 0;
            food = generateFood();
            running = true;

            document.getElementById("score").innerText = "Score: 0";
            startBtn.disabled = true;

            game = setInterval(draw, 300);
        }

        function changeDirection(e) {
            if(!running) return;

            if(e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
            else if(e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
            else if(e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
            else if(e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
        }

        function generateFood() {
            const cols = canvasSize / box;
            return {
                x: Math.floor(Math.random() * cols) * box,
                y: Math.floor(Math.random() * cols) * box
            };
        }

        function collision(head, array) {
            return array.some(part => part.x === head.x && part.y === head.y);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // draw snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#0f0" : "#0a0";
                ctx.fillRect(part.x, part.y, box, box);
            });

            // draw food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            let head = { ...snake[0] };

            if (direction === "UP") head.y -= box;
            else if (direction === "DOWN") head.y += box;
            else if (direction === "LEFT") head.x -= box;
            else if (direction === "RIGHT") head.x += box;

            // Wall collision
            if (
                head.x < 0 ||
                head.y < 0 ||
                head.x >= canvasSize ||
                head.y >= canvasSize
            ) {
                clearInterval(game);
                running = false;
                startBtn.disabled = false;
                alert("Game Over! Your Score: " + score);
                return;
            }

            // Will we eat?
            const willEat = (head.x === food.x && head.y === food.y);

            if (willEat) {
                score++;
                document.getElementById("score").innerText = "Score: " + score;
                food = generateFood();
            } else {
                // remove tail before self-collision check
                snake.pop();
            }

            // Self-collision (after tail removed if not eating)
            if (collision(head, snake)) {
                clearInterval(game);
                running = false;
                startBtn.disabled = false;
                alert("Game Over! Your Score: " + score);
                return;
            }

            snake.unshift(head);
        }

    </script>
</body>
</html>
